name: Venue link identity regressions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/venue-link-regression.yml'
      - 'src/services/providerIdentity.js'
      - 'src/services/venueLinkPolicy.js'
      - 'src/services/profileDescriptions.js'
      - 'scripts/audit-venue-links.js'
      - 'test/venueLink*.test.js'
      - 'data/venue-link-audit.json'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
