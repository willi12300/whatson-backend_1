name: Catalogue venue link audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/venue-link-audit.yml'
      - 'scripts/audit-venue-links.js'
permissions:
  contents: write
concurrency:
  group: catalogue-link-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run regression tests
        run: npm test
      - name: Record live health and Ferraiolo quarantine status
        run: |
          node - <<'NODE'
          const base='https://whatson-backend1-production.up.railway.app'
          ;(async()=>{for(const path of ['/health','/venues/7253/profile','/venue-link-audit/catalogue?limit=1']){try{const r=await fetch(base+path,{signal:AbortSignal.timeout(20000)});console.log('LIVE PROBE',path,r.status);if(r.ok&&path.includes('profile')){const v=await r.json();console.log('FER… PROFILE',JSON.stringify({id:v.id,name:v.name,hasWebsite:!!v.website,hasMenu:!!v.menu_url,hasPhoto:!!v.cover_photo,quarantine:v.link_identity_status}));}}catch(e){console.log('LIVE PROBE ERROR',path,e.name)}}})().catch(e=>{console.error(e);process.exit(1)})
          NODE
      - name: Audit all venues and all website/menu/social/booking fields
        run: node scripts/audit-venue-links.js
      - name: Save full report as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: venue-link-audit
          path: |
            audit-results/venue-link-audit.json
            audit-results/report.csv
            audit-results/report.json
            audit-results/catalogue.json
          retention-days: 30
      - name: Publish review branch without changing production
        env:
          AUDIT_BRANCH: audit/venue-links-${{ github.run_id }}
        run: |
          git checkout -b "$AUDIT_BRANCH"
          cp audit-results/venue-link-audit.json data/venue-link-audit.json
          mkdir -p reports
          cp audit-results/report.csv reports/venue-links.csv
          node -e "require('fs').writeFileSync('reports/venue-links-summary.json',JSON.stringify(JSON.parse(require('fs').readFileSync('audit-results/venue-link-audit.json')).counts,null,2))"
          git add data/venue-link-audit.json reports/venue-links.csv reports/venue-links-summary.json
          git -c user.name='SAPPO link audit' -c user.email='sappo-audit@users.noreply.github.com' commit -m 'Record full catalogue link identity audit for review'
          git push origin "$AUDIT_BRANCH"
          echo "Review branch: $AUDIT_BRANCH" >> "$GITHUB_STEP_SUMMARY"
