name: Refresh published ticket prices
on:
  schedule:
    - cron: '15 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ticket-prices
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --omit=dev
      - run: node scripts/build_ticket_prices.js
      - name: Publish refreshed source facts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ticket-prices.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh published ticket price facts'
          git pull --rebase origin main
          git push origin HEAD:main
